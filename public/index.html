<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <!-- ✅ RESPONSIVE VIEWPORT -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <meta name="description" content="Snaplet PJATK - Photo Sharing App">
    <meta name="theme-color" content="#000000">

    <title>📸 Snaplet PJATK</title>

    <link href="https://fonts.googleapis.com/css?family=Roboto:400,500,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/figma/styles.css">

    <style>
        /* ===================== */
        /* THEME CSS VARIABLES   */
        /* ===================== */
        :root {
            --bg-page: #F5E6D3;
            --bg-card: #FFFFFF;
            --bg-elevated: #FFFFFF;
            --bg-input: #f5f5f5;
            --bg-hover: #f5f5f5;
            --bg-placeholder: #ddd;
            --bg-media: #f0f0f0;
            --bg-unread: #f8f8f8;

            --color-primary: #3A2B20;
            --color-accent: #FDF5DD;

            --text-primary: #000000;
            --text-default: #333333;
            --text-secondary: #666666;
            --text-muted: #888888;
            --text-disabled: #999999;

            --border-default: #E0D5C7;
            --border-light: #eeeeee;
            --border-subtle: #f5f5f5;
            --border-input: #dddddd;
            --border-post: #f0f0f0;

            --icon-muted: #cccccc;
            --spinner-track: #f3f3f3;

            --nav-bg: #FFFFFF;
            --nav-active-bg: #F5E6D3;
            --nav-border: #E0E0E0;

            --msg-own-bg: #3A2B20;
            --msg-own-text: #FDF5DD;
            --msg-other-bg: #FFFFFF;
            --msg-other-text: #333333;

            --error-bg: #ffe6e6;
            --error-text: #cc0000;

            --shadow-card: rgba(0,0,0,0.1);
        }

        [data-theme="dark"] {
            --bg-page: #121212;
            --bg-card: #1E1E1E;
            --bg-elevated: #252525;
            --bg-input: #2A2A2A;
            --bg-hover: #2A2A2A;
            --bg-placeholder: #444444;
            --bg-media: #2A2A2A;
            --bg-unread: #252525;

            --color-primary: #D4A574;
            --color-accent: #2A2218;

            --text-primary: #F5F5F5;
            --text-default: #E0E0E0;
            --text-secondary: #AAAAAA;
            --text-muted: #888888;
            --text-disabled: #666666;

            --border-default: #333333;
            --border-light: #2A2A2A;
            --border-subtle: #2A2A2A;
            --border-input: #444444;
            --border-post: #2A2A2A;

            --icon-muted: #555555;
            --spinner-track: #333333;

            --nav-bg: #1A1A1A;
            --nav-active-bg: #2A2218;
            --nav-border: #333333;

            --msg-own-bg: #D4A574;
            --msg-own-text: #1A1A1A;
            --msg-other-bg: #1E1E1E;
            --msg-other-text: #E0E0E0;

            --error-bg: #3A1A1A;
            --error-text: #FF6666;

            --shadow-card: rgba(0,0,0,0.3);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #000;
            overflow-x: hidden;
        }

        /* ROOT APP */
        #root {
            width: 100%;
            min-height: 100vh;
            background: var(--bg-page);
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }

        /* LOADING */
        #loading-screen {
            position: fixed;
            inset: 0;
            background: linear-gradient(135deg, #667eea, #764ba2);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            z-index: 9999;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(255,255,255,0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* ===================== */
        /* MOBILE FIRST LAYOUT   */
        /* ===================== */

        .screen {
            padding: 56px 16px calc(80px + env(safe-area-inset-bottom, 0px));
            min-height: 100vh;
        }

        .photo-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
        }

        button,
        .btn,
        .nav-item {
            min-width: 44px;
            min-height: 44px;
        }

        /* ===================== */
        /* TABLET                */
        /* ===================== */
        @media (min-width: 481px) {
            .photo-grid {
                grid-template-columns: repeat(4, 1fr);
            }

            .screen {
                padding: 64px 24px 96px;
            }
        }

        /* ===================== */
        /* DESKTOP               */
        /* ===================== */
        @media (min-width: 769px) {
            #root {
                max-width: 1200px;
                margin: 0 auto;
            }

            .photo-grid {
                grid-template-columns: repeat(6, 1fr);
            }
        }

        /* ===================== */
        /* LANDSCAPE             */
        /* ===================== */
        @media (orientation: landscape) and (max-width: 768px) {
            .screen {
                padding-top: 32px;
            }
        }

        /* ===================== */
        /* BOTTOM NAV            */
        /* ===================== */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            padding-bottom: env(safe-area-inset-bottom, 0px);
            background: var(--nav-bg);
            display: flex;
            justify-content: space-around;
            align-items: center;
            border-top: 1px solid var(--nav-border);
        }

        .nav-item {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 24px;
        }
    </style>
</head>
<body>

<div id="loading-screen">
    <h1>📸 Snaplet</h1>
    <div class="spinner"></div>
    <p>Loading your moments...</p>
</div>

<div id="root"></div>

<script>
    // Apply saved theme immediately to prevent flash
    (function() {
        var saved = localStorage.getItem('theme');
        if (saved === 'dark' || (!saved && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.setAttribute('data-theme', 'dark');
            var meta = document.querySelector('meta[name="theme-color"]');
            if (meta) meta.setAttribute('content', '#121212');
        }
    })();

    window.addEventListener('load', () => {
        const loading = document.getElementById('loading-screen');
        if (loading) {
            loading.style.opacity = '0';
            loading.style.transition = 'opacity 0.4s';
            setTimeout(() => loading.remove(), 400);
        }
    });
</script>

</body>
</html>
